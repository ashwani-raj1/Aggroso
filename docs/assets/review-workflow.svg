<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Listing review workflow</title>
  <desc id="desc">Five clear stages from listing input to an immutable approved revision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbf8"/><stop offset="1" stop-color="#eaf7f0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#173f33" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62bd8e"/></marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g stroke="#62bd8e" stroke-width="4" marker-end="url(#arrow)">
    <path d="M242 150H270"/><path d="M470 150H498"/><path d="M698 150H726"/><path d="M926 150H954"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(42 78)"><rect width="200" height="144" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="100" cy="36" r="20" fill="#dff5e9"/><text x="100" y="42" font-size="18" font-weight="700" fill="#126b49">1</text><text x="100" y="80" font-size="18" font-weight="700" fill="#173f33">Create</text><text x="100" y="108" font-size="13" fill="#60766e">Manual form or Excel</text></g>
    <g transform="translate(270 78)"><rect width="200" height="144" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="100" cy="36" r="20" fill="#dff5e9"/><text x="100" y="42" font-size="18" font-weight="700" fill="#126b49">2</text><text x="100" y="80" font-size="18" font-weight="700" fill="#173f33">Validate</text><text x="100" y="108" font-size="13" fill="#60766e">Rules and duplicates</text></g>
    <g transform="translate(498 78)"><rect width="200" height="144" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="100" cy="36" r="20" fill="#dff5e9"/><text x="100" y="42" font-size="18" font-weight="700" fill="#126b49">3</text><text x="100" y="80" font-size="18" font-weight="700" fill="#173f33">Review</text><text x="100" y="108" font-size="13" fill="#60766e">Policies and Gemini</text></g>
    <g transform="translate(726 78)"><rect width="200" height="144" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="100" cy="36" r="20" fill="#dff5e9"/><text x="100" y="42" font-size="18" font-weight="700" fill="#126b49">4</text><text x="100" y="80" font-size="18" font-weight="700" fill="#173f33">Decide</text><text x="100" y="108" font-size="13" fill="#60766e">Approve, edit, or reject</text></g>
    <g transform="translate(954 78)"><rect width="200" height="144" rx="18" fill="#0f7655" stroke="#0f7655"/><circle cx="100" cy="36" r="20" fill="#d7f4e5"/><text x="100" y="42" font-size="18" font-weight="700" fill="#0f7655">5</text><text x="100" y="80" font-size="18" font-weight="700" fill="#fff">Finalize</text><text x="100" y="108" font-size="13" fill="#d7f4e5">Revision and audit trail</text></g>
  </g>
</svg>
