<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="330" viewBox="0 0 1320 330" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace listing review journey</title><desc id="desc">Six stages from preparation and confirmation through automated review and human approval.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbf8"/><stop offset="1" stop-color="#e5f5eb"/></linearGradient><linearGradient id="final" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19805a"/><stop offset="1" stop-color="#0d563d"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173f33" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65bd8d"/></marker></defs>
  <rect width="1320" height="330" rx="26" fill="url(#bg)"/><text x="52" y="50" font-family="Arial" font-size="18" font-weight="700" fill="#173f33">End-to-end review lifecycle</text><text x="52" y="75" font-family="Arial" font-size="13" fill="#61776e">Durable background processing with an explicit human approval boundary</text>
  <g stroke="#65bd8d" stroke-width="4" marker-end="url(#arrow)"><path d="M236 194H258"/><path d="M446 194H468"/><path d="M656 194H678"/><path d="M866 194H888"/><path d="M1076 194H1098"/></g>
  <g font-family="Arial" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(38 116)"><rect width="198" height="156" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="99" cy="37" r="20" fill="#ddf5e7"/><text x="99" y="43" font-size="18" font-weight="700" fill="#126b49">1</text><text x="99" y="83" font-size="17" font-weight="700" fill="#173f33">Prepare</text><text x="99" y="110" font-size="12" fill="#60766e">Manual form or Excel</text><text x="99" y="130" font-size="12" fill="#60766e">with product image</text></g>
    <g transform="translate(248 116)"><rect width="198" height="156" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="99" cy="37" r="20" fill="#ddf5e7"/><text x="99" y="43" font-size="18" font-weight="700" fill="#126b49">2</text><text x="99" y="83" font-size="17" font-weight="700" fill="#173f33">Confirm</text><text x="99" y="110" font-size="12" fill="#60766e">Review details before</text><text x="99" y="130" font-size="12" fill="#60766e">creating the record</text></g>
    <g transform="translate(458 116)"><rect width="198" height="156" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="99" cy="37" r="20" fill="#ddf5e7"/><text x="99" y="43" font-size="18" font-weight="700" fill="#126b49">3</text><text x="99" y="83" font-size="17" font-weight="700" fill="#173f33">Validate</text><text x="99" y="110" font-size="12" fill="#60766e">Rules, limits, and</text><text x="99" y="130" font-size="12" fill="#60766e">duplicate protection</text></g>
    <g transform="translate(668 116)"><rect width="198" height="156" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="99" cy="37" r="20" fill="#ddf5e7"/><text x="99" y="43" font-size="18" font-weight="700" fill="#126b49">4</text><text x="99" y="83" font-size="17" font-weight="700" fill="#173f33">Evaluate</text><text x="99" y="110" font-size="12" fill="#60766e">Background worker,</text><text x="99" y="130" font-size="12" fill="#60766e">policies, and Gemini</text></g>
    <g transform="translate(878 116)"><rect width="198" height="156" rx="18" fill="#fff" stroke="#b8dfca"/><circle cx="99" cy="37" r="20" fill="#ddf5e7"/><text x="99" y="43" font-size="18" font-weight="700" fill="#126b49">5</text><text x="99" y="83" font-size="17" font-weight="700" fill="#173f33">Decide</text><text x="99" y="110" font-size="12" fill="#60766e">Approve, edit, or</text><text x="99" y="130" font-size="12" fill="#60766e">reject every finding</text></g>
    <g transform="translate(1088 116)"><rect width="198" height="156" rx="18" fill="url(#final)" stroke="#0f684a"/><circle cx="99" cy="37" r="20" fill="#d7f4e5"/><text x="99" y="43" font-size="18" font-weight="700" fill="#0f684a">6</text><text x="99" y="83" font-size="17" font-weight="700" fill="#fff">Finalize</text><text x="99" y="110" font-size="12" fill="#d7f4e5">Immutable revision</text><text x="99" y="130" font-size="12" fill="#d7f4e5">and audit history</text></g>
  </g>
</svg>
