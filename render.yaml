services:
  - type: web
    name: marketplace-reviewer-api
    runtime: node
    plan: free
    # TypeScript, Prisma CLI, and declaration packages are build-time devDependencies.
    # Render sets NODE_ENV=production, so explicitly include them during the build.
    buildCommand: npm ci --include=dev && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CLIENT_ORIGIN
        sync: false
