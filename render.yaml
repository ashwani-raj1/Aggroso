services:
  - type: web
    name: marketplace-reviewer-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate -w backend && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CLIENT_ORIGIN
        sync: false
